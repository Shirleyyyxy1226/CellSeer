[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellviz"
version = "0.1.0"
description = "Reusable battery plotting figures for ICA and related analyses."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "plotly",
  "pandas",
  "numpy",
]

[project.optional-dependencies]
neware = ["openpyxl"]
pyprobe = ["PyProBE-Data", "polars"]
dash = ["dash"]
test = ["pytest"]
all = ["cellviz[neware,pyprobe,dash,test]"]

[tool.hatch.build.targets.wheel]
packages = ["src/cellviz"]
