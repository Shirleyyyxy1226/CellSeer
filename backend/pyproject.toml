[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellseer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20",
    "pydantic>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
pyprobe = ["pyprobe"]
duckdb = ["duckdb>=0.10"]

[project.scripts]
cellseer = "cellseer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cellseer*"]
