[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cellseer-backend"
version = "1.0.1"
description = "CellSeer FastAPI backend — run from repo root via uvicorn backend.api:app"
requires-python = ">=3.9"
dependencies = [
  "pandas>=1.3.0",
  "openpyxl>=3.0.0",
  "matplotlib>=3.3.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.22.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "numpy>=1.24.0",
  "polars>=0.20.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "PyProBE-Data>=2.6.0",
  "orjson>=3.9",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
