name: Deploy Demo to GitHub Pages
# Pages source: GitHub Actions (publishes directly via the Pages API).
# Deploy allowed from the demo branch via the github-pages environment.
# (re-trigger after a transient Pages deploy failure)

on:
  push:
    branches:
      - demo
    paths:
      - 'frontend/**'
      - 'docs-refreshed/**'
      - 'repo-docs-refreshed/**'
      - 'scripts/build_docs_site.sh'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build demo
        run: cd frontend && DEPLOY_ENV=gh-pages npm run build

      - name: SPA fallback (serve index.html for deep links)
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Build docs into dist/docs (served at /CellSeer/docs/)
        run: bash scripts/build_docs_site.sh frontend/dist/docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
